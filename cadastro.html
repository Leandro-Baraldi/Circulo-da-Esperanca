<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Círculo da Esperança</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/script.js"></script>
</head>
<body>
  <header>
    <h1>Cadastro de Voluntários</h1>
    <nav>
      <a href="index.html" class="btn-voltar">🏠 Início</a>
      <a href="projetos.html" class="btn-voltar">📁 Projetos</a>
    </nav>
  </header>

  <main>
    <form id="formulario">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

      <label for="endereco">Endereço:</label>
      <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro, cidade" required>

      <label for="mensagem">Mensagem:</label>
      <textarea id="mensagem" name="mensagem" required></textarea>

      <button type="submit">Enviar</button>
      <p id="mensagemErro"></p>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Círculo da Esperança</p>
  </footer>
</body>
</html>
